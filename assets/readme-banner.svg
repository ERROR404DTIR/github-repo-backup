<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">GitHub Repository Backup</title><desc id="d">Repository cards flow into a secure backup archive.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172943"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#182f4a" stroke="#62e3c1" stroke-width="2"><rect x="90" y="92" width="170" height="112" rx="12"/><rect x="300" y="92" width="170" height="112" rx="12"/><rect x="510" y="92" width="170" height="112" rx="12"/></g><g fill="#edf3ff" font-family="monospace" font-size="14" text-anchor="middle"><text x="175" y="150">REPO A</text><text x="385" y="150">REPO B</text><text x="595" y="150">REPO C</text></g><g fill="none" stroke="#8fa8ff" stroke-width="4" stroke-dasharray="10 10"><path d="M260 148H300M470 148H510M680 148H800"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.5s" repeatCount="indefinite"/></path></g><rect x="825" y="75" width="250" height="145" rx="16" fill="#152c40" stroke="#a89bff" stroke-width="3"/><path d="M900 120H1000V185H900Z M915 108H985V120H915Z" fill="none" stroke="#62e3c1" stroke-width="4"/><text x="950" y="205" fill="#edf3ff" text-anchor="middle" font-family="monospace" font-size="13">BACKUP ARCHIVE</text><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">GITHUB REPO BACKUP</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">MIRROR / ARCHIVE / RESTORE</text></svg>